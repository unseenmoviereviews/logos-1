<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E0B14">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Логос-1</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Russo+One&family=PT+Mono&family=Golos+Text:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--ink:#0E0B14;--card:rgba(17,13,24,.78);--cream:#F6E9D2;--mute:#BDAE95;--or:#F28C3A;--ye:#F2C14E;--te:#4FC3C9;--crt:#8CFFA6;--red:#FF6F5E;--line:rgba(246,233,210,.15)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--ink);color:var(--cream)}
body{font-family:"Golos Text",-apple-system,system-ui,sans-serif;font-size:16px;line-height:1.45;-webkit-text-size-adjust:100%;overflow-x:hidden}
button{font:inherit;color:inherit;cursor:pointer;-webkit-appearance:none;appearance:none}
button:disabled{cursor:default}
.bg{position:fixed;left:0;top:0;width:100%;height:100vh;height:100lvh;background-size:cover;background-position:center;opacity:0;transition:opacity .9s ease;z-index:0;animation:kb 40s ease-in-out infinite alternate}
.bg.on{opacity:1}
@keyframes kb{from{transform:scale(1.02)}to{transform:scale(1.12) translateY(-1.5%)}}
#shade{position:fixed;left:0;top:0;width:100%;height:100vh;height:100lvh;z-index:1;pointer-events:none;
 background:linear-gradient(180deg,rgba(14,11,20,.35) 0,rgba(14,11,20,0) 18%,rgba(14,11,20,0) 38%,rgba(14,11,20,.55) 70%,rgba(14,11,20,.8) 100%),
 radial-gradient(ellipse at 50% 40%,rgba(0,0,0,0) 55%,rgba(0,0,0,.45) 100%)}
#grain{position:fixed;inset:0;z-index:2;pointer-events:none;opacity:.5;mix-blend-mode:overlay;
 background:repeating-linear-gradient(0deg,rgba(255,240,220,.05) 0 1px,rgba(0,0,0,0) 1px 3px)}
#app{position:relative;z-index:3;max-width:560px;margin:0 auto}
.scr{min-height:100vh;min-height:100svh;display:flex;flex-direction:column;padding-bottom:max(16px,env(safe-area-inset-bottom))}
.top{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:8px;padding:10px 14px 12px;padding-top:max(10px,env(safe-area-inset-top));
 background:rgba(14,11,20,.62);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);font-family:"PT Mono",monospace;font-size:12px;letter-spacing:.06em}
.top-l{font-family:"Russo One",sans-serif;font-size:14px;color:var(--or);white-space:nowrap;display:flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--crt);box-shadow:0 0 8px var(--crt);animation:bl 1.6s steps(2) infinite}
@keyframes bl{50%{opacity:.25}}
.top-m{flex:1;text-align:center;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top-r{color:var(--ye);white-space:nowrap}
.fuel{position:absolute;left:0;right:0;bottom:0;height:3px;background:rgba(255,255,255,.08)}
.fuel i{display:block;height:100%;background:linear-gradient(90deg,var(--or),var(--ye),var(--te))}
.hero{height:34vh;min-height:200px;display:flex;align-items:flex-end;padding:0 18px 14px}
.hero.sm{height:24vh;min-height:150px}
.hero-full .spacer{flex:1;min-height:34vh}
.hero-t,.title-wrap{text-shadow:0 2px 14px rgba(0,0,0,.7),0 1px 2px rgba(0,0,0,.8)}
.title-wrap{padding:0 18px 14px}
.kick{font-family:"PT Mono",monospace;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--ye)}
h1,h2,h3{font-family:"Russo One",sans-serif;font-weight:400;margin:4px 0 0;line-height:1.08}
h2{font-size:32px}h3{font-size:22px}
.h-big{font-size:44px}
.logo{font-size:64px;letter-spacing:.04em;background:linear-gradient(180deg,#FFF3DE 0,#F6C07A 55%,#F28C3A 100%);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:none;filter:drop-shadow(0 3px 10px rgba(0,0,0,.7))}
.tagline{font-family:"PT Mono",monospace;font-size:14px;margin-top:6px;padding-top:10px;position:relative}
.tagline:before{content:"";position:absolute;left:0;top:0;width:150px;height:5px;background:linear-gradient(90deg,var(--or) 0 33%,var(--ye) 33% 66%,var(--te) 66%)}
.card{margin:0 12px;padding:18px 16px 18px;background:var(--card);-webkit-backdrop-filter:blur(16px) saturate(1.2);backdrop-filter:blur(16px) saturate(1.2);border:1px solid var(--line);border-radius:20px;box-shadow:0 10px 40px rgba(0,0,0,.4)}
.card.slim{padding:12px}
.card p{margin:0 0 12px}
.lead{font-size:18px}
.small{font-size:13px;color:var(--mute);margin:12px 0 0!important}
.fl{display:block;font-size:13px;color:var(--mute);margin:10px 0 4px}
.inp{width:100%;font:inherit;font-size:17px;padding:13px 14px;border-radius:12px;border:1px solid var(--line);background:rgba(0,0,0,.35);color:var(--cream);outline:none}
.inp:focus{border-color:var(--or)}
.err{color:var(--red);font-size:14px;margin-top:8px}
.btn{display:block;width:100%;margin-top:14px;padding:15px 16px;border:0;border-radius:14px;font-family:"Russo One",sans-serif;font-size:17px;letter-spacing:.02em;color:#1A1008;background:linear-gradient(180deg,#F8A65C,#F28C3A);box-shadow:0 4px 0 #A9541C,0 8px 18px rgba(242,140,58,.25)}
.btn:active{transform:translateY(2px);box-shadow:0 2px 0 #A9541C}
.btn:disabled{opacity:.35;box-shadow:none}
.btn.big{font-size:19px;padding:17px}
.btn.ghost{background:rgba(255,255,255,.08);color:var(--cream);box-shadow:none;border:1px solid var(--line)}
.btns2{display:flex;gap:10px}.btns2 .btn{flex:1}
.link{background:none;border:0;color:var(--mute);text-decoration:underline;font-size:14px;padding:8px 0}
.crt{margin:12px 0;padding:12px 14px;border-radius:12px;background:rgba(6,20,12,.88);border:1px solid rgba(140,255,166,.3);color:var(--crt);font-family:"PT Mono",monospace;font-size:14.5px;line-height:1.45;text-shadow:0 0 6px rgba(140,255,166,.45);
 background-image:repeating-linear-gradient(0deg,rgba(0,0,0,.22) 0 1px,rgba(0,0,0,0) 1px 3px)}
.crt-h{font-weight:700;margin-bottom:4px;display:flex;justify-content:space-between;gap:8px}
.crt-h span{white-space:nowrap}
.crt.fb{color:#D9FFE2;font-family:"Golos Text",sans-serif;font-size:15px;text-shadow:none}
.crt.fb .crt-h{font-family:"PT Mono",monospace;color:var(--crt);text-shadow:0 0 6px rgba(140,255,166,.45)}
.crt.nope{border-color:rgba(255,111,94,.6);background-color:rgba(32,8,6,.9)}
.crt.nope .crt-h{color:#FF9C8E;text-shadow:0 0 6px rgba(255,111,94,.5)}
.crt.half{border-color:rgba(242,193,78,.6)}
.crt.half .crt-h{color:var(--ye);text-shadow:0 0 6px rgba(242,193,78,.5)}
.crew{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.badge{flex:0 0 46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:"Russo One",sans-serif;font-size:20px;color:#1A1008}
.b0{background:var(--or)}.b1{background:var(--ye)}.b2{background:var(--te)}.b3{background:#0B2416;color:var(--crt);border:1px solid var(--crt);border-radius:10px}.b4{background:var(--cream)}
.crew-r{font-family:"PT Mono",monospace;font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--mute)}
.crew-n{font-weight:600;font-size:16px}
.crew-l{font-size:14px;color:#E6D8BF}
.crew-pc .crew-n{font-family:"PT Mono",monospace;color:var(--crt)}
.qn{font-family:"PT Mono",monospace;font-size:12px;letter-spacing:.08em;color:var(--ye);text-transform:uppercase}
.hint{font-size:13px;color:var(--mute);margin:4px 0 10px}
.q{font-size:18px;font-weight:500;margin:0 0 12px;line-height:1.38}
.q.given{font-family:"PT Mono",monospace;font-size:15.5px;color:var(--ye);background:rgba(242,193,78,.08);border:1px dashed rgba(242,193,78,.45);border-radius:10px;padding:10px 12px}
.q.eq{font-size:17px;line-height:1.7}
.ta,.tb{display:inline-block;width:26px;height:26px;line-height:26px;text-align:center;border-radius:6px;font-family:"Russo One",sans-serif;font-size:14px;color:#1A1008;margin-right:4px}
.ta{background:var(--or)}.tb{background:var(--te)}
.opts{display:flex;flex-direction:column;gap:8px}
.opts.row{flex-direction:row;flex-wrap:wrap}.opts.row .opt{flex:1 1 40%;text-align:center}
.opt{text-align:left;padding:13px 14px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.06);font-size:16px;line-height:1.3}
.opt:active{background:rgba(242,140,58,.2)}
.ok{border-color:var(--crt)!important;background:rgba(140,255,166,.16)!important;color:#E4FFEA}
.bad{border-color:var(--red)!important;background:rgba(255,111,94,.18)!important}
.dim{opacity:.45}
.egrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.eopt{padding:8px 6px 10px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.05);display:flex;flex-direction:column;align-items:center;gap:4px}
.eopt svg{width:100%;max-width:170px;height:auto;display:block}
.eopt span{font-size:12.5px;line-height:1.2;text-align:center;color:#E6D8BF}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:10px 13px;border-radius:999px;border:1px solid var(--line);background:rgba(255,255,255,.06);font-size:15px;line-height:1.25;text-align:left}
.chip.on{background:rgba(242,140,58,.28);border-color:var(--or)}
.chip.miss{border-style:dashed;border-color:var(--crt);color:var(--crt)}
.parse{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:4px}
.tok{display:flex;flex-direction:column;align-items:flex-start;padding:10px 12px;border-radius:12px;border:1px dashed rgba(246,233,210,.45);background:rgba(255,255,255,.05);min-width:64px}
.tok b{font-size:17px;font-weight:600}
.tok small{font-family:"PT Mono",monospace;font-size:11px;letter-spacing:.06em;color:var(--mute);text-transform:uppercase;margin-top:2px}
.tok em{font-style:normal;font-size:11px;color:var(--crt);font-family:"PT Mono",monospace;text-transform:uppercase}
.tok.rQ{border:1px solid var(--ye);background:rgba(242,193,78,.16)}.tok.rQ small{color:var(--ye)}
.tok.rS{border:1px solid var(--or);background:rgba(242,140,58,.2)}.tok.rS small{color:#FFC08A}
.tok.rC{border:1px solid #C9B99A;background:rgba(201,185,154,.14)}.tok.rC small{color:#E6D8BF}
.tok.rP{border:1px solid var(--te);background:rgba(79,195,201,.18)}.tok.rP small{color:#9FE6EA}
.seq{border:1px solid var(--line);border-radius:14px;padding:8px;background:rgba(0,0,0,.25)}
.seq-l{font-family:"PT Mono",monospace;font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--mute);padding:2px 4px}
.slot{display:flex;align-items:center;gap:10px;width:100%;min-height:44px;margin:5px 0;padding:8px 10px;border-radius:10px;border:1px dashed rgba(246,233,210,.25);text-align:left;font-size:15px;flex-wrap:wrap}
.slot i{font-style:normal;font-family:"Russo One",sans-serif;font-size:13px;width:24px;height:24px;line-height:24px;text-align:center;border-radius:50%;background:rgba(255,255,255,.1);flex:0 0 24px}
.slot.full{border:1px solid var(--or);background:rgba(242,140,58,.16)}
.slot span{flex:1;min-width:0}
.slot em{font-style:normal;flex-basis:100%;font-size:12.5px;color:var(--crt);padding-left:34px}
.pool{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.pchip{padding:10px 13px;border-radius:10px;border:1px solid var(--te);background:rgba(79,195,201,.14);font-size:15px;text-align:left}
.sq{display:flex;flex-direction:column;gap:10px}
.sqt{font-size:15.5px;margin-bottom:6px}
.seg{display:flex;gap:6px}
.sg{flex:1;padding:10px 4px;border-radius:10px;border:1px solid var(--line);background:rgba(255,255,255,.06);font-size:14px}
.sg.on{background:rgba(242,140,58,.3);border-color:var(--or)}
.mark{display:flex;gap:14px;align-items:center;padding:14px;border-radius:16px;background:rgba(0,0,0,.3);border:1px solid var(--line);margin-bottom:12px}
.mark-n{font-family:"Russo One",sans-serif;font-size:64px;line-height:1;width:76px;height:76px;flex:0 0 76px;display:flex;align-items:center;justify-content:center;border-radius:16px;color:#1A1008}
.m5 .mark-n{background:var(--crt)}.m4 .mark-n{background:var(--te)}.m3 .mark-n{background:var(--ye)}.m2 .mark-n{background:var(--red)}
.mark-s{font-family:"PT Mono",monospace;font-size:13px;color:var(--ye)}
.mark-t{font-size:15px;margin-top:2px}
.bar{margin:8px 0}
.bar-t{display:flex;justify-content:space-between;font-size:14px}
.bar-b{height:8px;border-radius:4px;background:rgba(255,255,255,.1);overflow:hidden;margin-top:4px}
.bar-b i{display:block;height:100%;background:linear-gradient(90deg,var(--or),var(--ye))}
.eh{font-family:"Russo One",sans-serif;font-weight:400;font-size:18px;margin:18px 0 6px}
.err-i{padding:10px 0;border-top:1px solid var(--line);font-size:14px}
.err-s{font-family:"PT Mono",monospace;font-size:11.5px;color:var(--mute);text-transform:uppercase;letter-spacing:.06em}
.err-q{margin:2px 0}
.err-a{color:var(--crt)}
.reset{margin-top:16px;border-top:1px solid var(--line);padding-top:6px}
@media (max-width:360px){h2{font-size:27px}.h-big{font-size:36px}.logo{font-size:50px}.q{font-size:16.5px}.eopt span{font-size:11.5px}.card{margin:0 8px;padding:14px 12px}}

.acode{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 0 12px;padding:10px 14px;border:2px dashed rgba(140,255,166,.55);border-radius:14px;background:rgba(6,20,12,.85)}
.acode span{font-family:"PT Mono",monospace;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}

 hint:"Отметьте все существенные признаки. 2 балла за точный ответ, 1 — за одну ошибку.",
 items:[
  {t:"multi", q:"Понятие: КВАДРАТ", o:[["четырёхугольник",1],["все стороны равны",1],["все углы прямые",1],["нарисован мелом на доске",0],["сторона равна 5 см",0],["красного цвета",0]],
   why:"Квадрат — четырёхугольник, у которого все стороны равны и все углы прямые. Мел, цвет и размер можно поменять — квадрат останется квадратом."},
  {t:"multi", q:"Понятие: СВИДЕТЕЛЬ (в уголовном процессе)", o:[["лицо, которому могут быть известны обстоятельства дела",1],["вызвано для дачи показаний",1],["пришёл в пиджаке",0],["заметно волнуется",0],["живёт рядом с местом происшествия",0],["пришёл точно вовремя",0]],
   why:"По ст. 56 УПК РФ свидетель — лицо, которому могут быть известны обстоятельства, имеющие значение для дела, и которое вызвано для дачи показаний. Пиджак и волнение статуса не меняют."},
  {t:"multi", q:"Понятие: КОСМОНАВТ", o:[["человек",1],["совершает или совершил космический полёт",1],["носит шлем с надписью «СССР»",0],["любит борщ из тюбика",0],["носит усы",0],["родом из Калуги",0]],
   why:"Космонавт — человек, совершающий или совершивший космический полёт. Шлем, усы и любовь к тюбикам — несущественные (хотя и очень частые) признаки."},
  {t:"multi", q:"Понятие: ЕСТЕСТВЕННЫЙ СПУТНИК", o:[["небесное тело",1],["обращается вокруг планеты",1],["не создан человеком",1],["покрыт кратерами",0],["светит ночью",0],["называется Луной",0]],
   why:"Естественный спутник — небесное тело природного происхождения, обращающееся вокруг планеты. Кратеры бывают не у всех, «Луна» — имя одного спутника, а не признак всех."}
 ]},
{id:"s2", block:"I", bg:"crt", kicker:"Отсек I · Опознание", title:"Единичное или общее?",
 text:["В трюме обнаружены предметы без бирок. ЛОГОС просит описать их признаки.",
       "ЛОГОС: «ЕДИНИЧНЫЙ ПРИЗНАК ПРИНАДЛЕЖИТ ТОЛЬКО ЭТОМУ ПРЕДМЕТУ. ОБЩИЙ — ЕСТЬ И У ДРУГИХ. НЕ ПУТАТЬ. Я ЗАПИСЫВАЮ»."],
 hint:"Какой признак назван — единичный или общий?",
 items:[

  {t:"choice", fixed:1, q:"Юрий Гагарин — лётчик.", o:["единичный","общий"], a:1, why:"Лётчиков много. Признак общий для целого класса людей."},
  {t:"choice", fixed:1, q:"Марс — планета, у которой есть спутник Фобос.", o:["единичный","общий"], a:0, why:"Фобос есть только у Марса — этот признак принадлежит одному предмету."},
  {t:"choice", fixed:1, q:"Марс — планета, вращающаяся вокруг Солнца.", o:["единичный","общий"], a:1, why:"Вокруг Солнца вращается восемь планет — признак общий."}
 ]},
{id:"s3", block:"I", bg:"stars", kicker:"Отсек I · Грузовой трюм", title:"Инвентаризация понятий",
 text:["Командир требует опись груза. ЛОГОС сортирует понятия по объёму.",
       "Единичное — объём из одного предмета. Общее — больше одного. Пустое (нулевое) — объём, в котором нет ни одного реального предмета.",
       "ЛОГОС: «ПУСТЫЕ ПОНЯТИЯ ГРУЗИТЬ НЕЛЬЗЯ. ОНИ НИЧЕГО НЕ ВЕСЯТ, НО ЗАНИМАЮТ МЕСТО В ГОЛОВЕ»."],
 hint:"Определите вид понятия по объёму.",
 items:[
  {t:"choice", fixed:1, q:"«Марс»", o:["единичное","общее","пустое"], a:0, why:"Марс один. Объём — один предмет."},
  {t:"choice", fixed:1, q:"«Планета Солнечной системы»", o:["единичное","общее","пустое"], a:1, why:"Таких планет восемь — понятие общее."},
  {t:"choice", fixed:1, q:"«Вечный двигатель»", o:["единичное","общее","пустое"], a:2, why:"Ни одного реального вечного двигателя не существует — объём пуст."},
  {t:"choice", fixed:1, q:"«Первый человек, побывавший в открытом космосе»", o:["единичное","общее","пустое"], a:0, why:"Первым был один человек (Алексей Леонов) — понятие единичное, даже если имя не названо."},
  {t:"choice", fixed:1, q:"«Созвездие»", o:["единичное","общее","пустое"], a:1, why:"Созвездий много (88). Понятие общее — то, что каждое созвездие состоит из многих звёзд, на объём не влияет."},
  {t:"choice", fixed:1, q:"«Круглый квадрат»", o:["единичное","общее","пустое"], a:2, why:"Признаки противоречат друг другу — такого предмета быть не может. Объём пуст."}
 ]},
{id:"s4", block:"I", bg:"helmet", kicker:"Отсек I · Ярлыки", title:"Наклейки на ящиках",
 text:["Бортинженер Сомов клеит на ящики ярлыки. ЛОГОС проверяет каждый.",
       "Собирательное — мыслит группу как одно целое. Абстрактное — мыслит свойство или отношение отдельно от предмета. Отрицательное — указывает на отсутствие признака. Относительное — имеет смысл только в паре с другим."],
 hint:"Какое это понятие?",
 items:[
  {t:"choice", fixed:1, q:"«Экипаж»", o:["собирательное","абстрактное","отрицательное","относительное"], a:0, why:"Экипаж — группа людей, мыслимая как одно целое."},
  {t:"choice", fixed:1, q:"«Отвага»", o:["собирательное","абстрактное","отрицательное","относительное"], a:1, why:"Отвага — свойство, взятое отдельно от отважных людей."},
  {t:"choice", fixed:1, q:"«Неисправный прибор»", o:["собирательное","абстрактное","отрицательное","относительное"], a:2, why:"Понятие указывает на отсутствие признака «исправный»."},
  {t:"choice", fixed:1, q:"«Подчинённый»", o:["собирательное","абстрактное","отрицательное","относительное"], a:3, why:"Подчинённым можно быть только по отношению к начальнику — понятие соотносительное."}
 ]},
{id:"s5", block:"I", bg:"crt", kicker:"Отсек I · Мастерская", title:"Как Сомов думает",
 text:["Пока все спят, бортинженер Сомов размышляет. ЛОГОС ведёт протокол его мыслей и подписывает приёмы образования понятий.",
       "Анализ — мысленно разделить на части. Синтез — соединить части в целое. Сравнение — найти сходство и различие. Абстрагирование — отвлечься от одних признаков ради других. Обобщение — перейти от отдельных предметов к общему."],
 hint:"Какой приём использован?",
 items:[
  {t:"choice", fixed:1, q:"Сомов мысленно разобрал насос на детали, чтобы понять, из чего он состоит.", o:["анализ","синтез","сравнение","абстрагирование","обобщение"], a:0, why:"Целое делится на части — анализ."},
  {t:"choice", fixed:1, q:"Из показаний десятка датчиков Сомов сложил единую картину неисправности.", o:["анализ","синтез","сравнение","абстрагирование","обобщение"], a:1, why:"Отдельные части соединены в целое — синтез."},
  {t:"choice", fixed:1, q:"Штурман положил рядом две звёздные карты и выяснил, чем они похожи и чем отличаются.", o:["анализ","синтез","сравнение","абстрагирование","обобщение"], a:2, why:"Сходство и различие — сравнение."},
  {t:"choice", fixed:1, q:"Командир велела забыть про цвет и форму ящиков и думать только об их массе.", o:["анализ","синтез","сравнение","абстрагирование","обобщение"], a:3, why:"Отвлечься от одних признаков и выделить другой — абстрагирование."},
  {t:"choice", fixed:1, q:"Изучив Луну, Фобос и Деймос, ЛОГОС заключил: все они — естественные спутники планет.", o:["анализ","синтез","сравнение","абстрагирование","обобщение"], a:4, why:"От отдельных предметов — к общему для них классу. Обобщение."}
 ]},
{id:"s6", block:"I", bg:"stars", kicker:"Отсек I · Телескоп", title:"Увеличение и уменьшение",
 text:["ЛОГОС включает телескоп. При каждом шаге объём понятия растёт — признаков в содержании становится меньше.",
       "Чем шире объём, тем беднее содержание. Это закон обратного отношения."],

   why:"Следователь СК — вид следователя; следователь — участник со стороны обвинения (гл. 6 УПК РФ); те — часть всех участников уголовного судопроизводства."}
 ]},
{id:"s7", block:"I", bg:"nebula", kicker:"Отсек I · Звёздные карты", title:"Круги Эйлера",
 text:["Штурман Синицын рисует звёздные карты. Каждое понятие — звёздная система-круг. Нужно показать, как они расположены друг относительно друга.",
       "ЛОГОС: «НЕВЕРНАЯ КАРТА = ПОЛЁТ НЕ ТУДА. ШТУРМАН, ВЫ МЕНЯ СЛЫШИТЕ?»"],
 hint:"Выберите схему, верно изображающую отношение A и B.",
 items:[
  {t:"euler", A:"космонавт", B:"человек", a:"in", why:"Всякий космонавт — человек, но не всякий человек — космонавт. Подчинение: A внутри B."},
  {t:"euler", A:"Марс", B:"четвёртая планета от Солнца", a:"eq", why:"Это один и тот же предмет, названный по-разному. Равнозначность — круги совпадают."},
  {t:"euler", A:"космонавт", B:"женщина", a:"cross", why:"Есть женщины-космонавты, есть космонавты-мужчины и женщины не-космонавты. Пересечение."},
  {t:"euler", A:"Марс", B:"Венера", a:"apart", why:"Разные планеты — соподчинённые понятия внутри рода «планета». Не пересекаются, и есть другие планеты."},
  {t:"euler", A:"исправный прибор", B:"неисправный прибор", a:"split", why:"Противоречие: прибор либо исправен, либо нет. Третьего не дано — круги делят всё поле."},
  {t:"euler", A:"юрист", B:"прокурор", a:"has", why:"Всякий прокурор — юрист, но не наоборот. Здесь B внутри A — порядок важен!"},
  {t:"euler", A:"штурман", B:"выпускник юрфака", a:"cross", why:"Бывают штурманы с юридическим дипломом (Синицын, например, заочно). Пересечение."},
  {t:"euler", A:"тяжёлый груз", B:"лёгкий груз", a:"apart", why:"Противоположность (контрарность): нельзя быть и тяжёлым, и лёгким, но есть груз средний. Место для третьего остаётся."}
 ]},

{id:"s8", block:"II", bg:"port", kicker:"Отсек II · Связь с Землёй", title:"Только суждения",
 text:["Центр управления полётом просит доклад. ЛОГОС передаёт на Землю только суждения — то, что можно признать истинным или ложным.",
       "Вопросы, приказы и восклицания он вежливо выбрасывает в открытый космос."],
 hint:"Выражает ли фраза суждение?",
 items:[
  {t:"choice", fixed:1, q:"«Марс — четвёртая планета от Солнца».", o:["суждение","не суждение"], a:0, why:"Утверждение, которое можно проверить. Оно истинно."},
  {t:"choice", fixed:1, q:"«Сколько осталось топлива?»", o:["суждение","не суждение"], a:1, why:"Обычный вопрос ничего не утверждает — он не истинен и не ложен."},
  {t:"choice", fixed:1, q:"«Пристегнуть ремни!»", o:["суждение","не суждение"], a:1, why:"Приказ не бывает истинным или ложным."},
  {t:"choice", fixed:1, q:"«Разве в вакууме можно дышать?»", o:["суждение","не суждение"], a:0, why:"Риторический вопрос: по форме вопрос, по сути утверждение «в вакууме дышать нельзя»."},
  {t:"choice", fixed:1, q:"«Земля плоская».", o:["суждение","не суждение"], a:0, why:"Суждение, просто ложное. Ложное суждение — тоже суждение."},
  {t:"choice", fixed:1, q:"«Ура!»", o:["суждение","не суждение"], a:1, why:"Восклицание выражает чувство, но ничего не утверждает."},
  {t:"choice", fixed:1, q:"«Все члены экипажа прошли медкомиссию».", o:["суждение","не суждение"], a:0, why:"Утверждение о классе предметов — суждение."},
  {t:"choice", fixed:1, q:"«Гоша, передай, пожалуйста, тюбик с борщом».", o:["суждение","не суждение"], a:1, why:"Просьба. Ни истинна, ни ложна (хотя борщ существует)."}
 ]},
{id:"s9", block:"II", bg:"panel", kicker:"Отсек II · Пульт", title:"Разбор команды",
 text:["Штурман вводит команды на пульт. ЛОГОС принимает их, только если каждая часть суждения подписана.",
       "Квантор — «все», «некоторые», «ни один», «этот». Субъект (S) — о чём говорим. Связка — «есть», «является», «—», «не является». Предикат (P) — что говорим о субъекте."],
 hint:"Нажимайте на фрагменты, чтобы подписать их. Каждое нажатие меняет роль: квантор → S → связка → P. 2 балла за точный разбор, 1 — за одну ошибку.",
 items:[
  {t:"parse", toks:[["Все","Q"],["космонавты","S"],["являются","C"],["отличниками физподготовки","P"]], why:"Все (квантор) космонавты (S) являются (связка) отличниками физподготовки (P)."},
  {t:"parse", toks:[["Марс","S"],["—","C"],["красная планета","P"]], why:"Тире здесь — связка. Квантора нет: суждение единичное."},
  {t:"parse", toks:[["Некоторые","Q"],["приборы","S"],["не являются","C"],["исправными","P"]], why:"Отрицание «не» входит в связку: «не являются». Предикат — «исправными»."},
  {t:"parse", toks:[["Ни один","Q"],["марсианин","S"],["не был","C"],["задержан патрулём","P"]], why:"«Ни один» — квантор, «не был» — связка, «задержан патрулём» — предикат."},
  {t:"parse", toks:[["Всякий","Q"],["штурман","S"],["есть","C"],["человек с картой","P"]], why:"Классическая форма «S есть P» — с той самой связкой «есть»."},
  {t:"parse", toks:[["Этот","Q"],["тюбик","S"],["не есть","C"],["источник витаминов","P"]], why:"«Этот» указывает на единичный предмет и играет роль квантора. «Не есть» — отрицательная связка."}
 ]},
{id:"s10", block:"II", bg:"port", kicker:"Отсек II · Шифровальщик", title:"A, E, I, O",
 text:["Для экономии эфира ЛОГОС шифрует суждения четырьмя буквами.",
       "A — общеутвердительное (все S есть P). E — общеотрицательное (ни одно S не есть P). I — частноутвердительное (некоторые S есть P). O — частноотрицательное (некоторые S не есть P).",
       "Единичное суждение ЛОГОС шифрует как общее: о субъекте говорят целиком."],
 hint:"Каким кодом зашифровать суждение?",
 items:[
  {t:"choice", fixed:1, q:"«Все космонавты — смелые люди».", o:["A","E","I","O"], a:0, why:"Общее + утвердительное = A."},
  {t:"choice", fixed:1, q:"«Ни один прибор не исправен».", o:["A","E","I","O"], a:1, why:"Общее + отрицательное = E."},
  {t:"choice", fixed:1, q:"«Некоторые члены экипажа — юристы».", o:["A","E","I","O"], a:2, why:"Частное + утвердительное = I."},
  {t:"choice", fixed:1, q:"«Некоторые консервы несъедобны».", o:["A","E","I","O"], a:2, why:"Ловушка! «Несъедобны» — это предикат с отрицательной частицей, но связка утвердительная: «некоторые консервы есть несъедобные». Это I."},
  {t:"choice", fixed:1, q:"«Марс — красная планета».", o:["A","E","I","O"], a:0, why:"Единичное утвердительное суждение — шифруется как A."},
  {t:"choice", fixed:1, q:"«Не все приборы исправны».", o:["A","E","I","O"], a:3, why:"«Не все» = «некоторые не»: некоторые приборы не являются исправными. Это O."},
  {t:"choice", fixed:1, q:"«Нет марсиан с пятью ногами».", o:["A","E","I","O"], a:1, why:"Ни один марсианин не имеет пяти ног — общеотрицательное, E."},
  {t:"choice", fixed:1, q:"«Большинство штурманов носят очки».", o:["A","E","I","O"], a:2, why:"«Большинство» — не «все», в логике это «некоторые». Частноутвердительное, I."}
 ]},
{id:"s11", block:"II", bg:"stars", kicker:"Отсек II · Прожектор", title:"Распределённость",
 text:["Термин распределён, если в суждении речь идёт обо всём его объёме — прожектор освещает весь круг.",
       "ЛОГОС: «БЕЗ ЭТОГО НЕ ВЫПОЛНИТЬ ОБРАЩЕНИЕ. А БЕЗ ОБРАЩЕНИЯ НЕ ПОСАДИТЬ КОРАБЛЬ. ТАК УСТРОЕН МИР»."],

function grade(it, g) {
  var i, err = 0;
  if (it.t === "choice") return g === it.a ? 1 : 0;
  if (it.t === "euler") return g === it.a ? 1 : 0;
  if (it.t === "multi") { for (i = 0; i < it.o.length; i++) if ((g.indexOf(i) >= 0) !== !!it.o[i][1]) err++; return err === 0 ? 2 : err === 1 ? 1 : 0; }
  if (it.t === "parse") { for (i = 0; i < it.toks.length; i++) if (g[i] !== it.toks[i][1]) err++; return err === 0 ? 2 : err === 1 ? 1 : 0; }
  if (it.t === "order") { for (i = 0; i < g.length; i++) if (g[i] !== i) err++; return err === 0 ? 2 : err === 2 ? 1 : 0; }
  if (it.t === "square") { var s = 0; for (i = 0; i < it.rows.length; i++) if (g[i] === it.rows[i][1]) s++; return s; }
  return 0;
}
function pick(arr, key) { return arr[hashStr(key + S.seed) % arr.length]; }

/* ---------- рендер ---------- */
function topbar(step, idx) {
  var label = "", pr = 0;
  if (step.k === "item" || step.k === "sec") { var sec = SECTIONS[step.s]; label = "ОТСЕК " + sec.block + " · " + blockName(sec.block).name.toUpperCase(); }
  else if (step.k === "block") label = "ОТСЕК " + step.b;
  else if (step.k === "final") label = "ВОЗВРАЩЕНИЕ";
  else label = "ПОДГОТОВКА";
  var n = itemNo(idx); pr = Math.round(n / NITEMS * 100);
  return '<div class="top"><div class="top-l"><span class="dot"></span>ЛОГОС-1</div><div class="top-m">' + label + '</div><div class="top-r">' + (S ? score() + " б." : "") + '</div>' +
    '<div class="fuel"><i style="width:' + pr + '%"></i></div></div>';
}
function render() {
  var app = document.getElementById("app");
  if (!S) { setBg("stars"); app.innerHTML = coverHtml(); return; }
  if (!STEPS) STEPS = buildSteps();
  var step = STEPS[S.cur], h = "";
  if (step.k === "cover") { S.cur = 1; step = STEPS[1]; }
  h += topbar(step, S.cur);
  if (step.k === "crew") { setBg("helmet"); h += crewHtml(); }
  else if (step.k === "launch") { setBg("rocket"); h += launchHtml(); }
  else if (step.k === "block") { var bn = blockName(step.b); setBg(step.b === "I" ? "crt" : step.b === "II" ? "port" : "mars"); h += blockHtml(bn); }
  else if (step.k === "sec") { setBg(SECTIONS[step.s].bg); h += secHtml(SECTIONS[step.s]); }
  else if (step.k === "item") { setBg(SECTIONS[step.s].bg); h += itemHtml(step); }
  else if (step.k === "final") { setBg("earth"); h += finalHtml(); }
  app.innerHTML = h;
}
function coverHtml() {
  return '<div class="scr hero-full"><div class="spacer"></div>' +
    '<div class="title-wrap"><div class="kick">Космическая экспедиция по логике · Тема 3</div><h1 class="logo">ЛОГОС-1</h1>' +
    '<div class="tagline">Понятие · Суждение · Умозаключение</div></div>' +
    '<div class="card"><p class="lead">Экипаж ждёт четвёртого члена. Им будете вы.</p>' +
    '<label class="fl">Фамилия и имя</label><input id="inName" class="inp" autocomplete="off" value="' + esc(draft.name) + '" placeholder="Например, Иванова Анна">' +
    '<label class="fl">Группа</label><input id="inGroup" class="inp" autocomplete="off" value="' + esc(draft.group) + '" placeholder="Номер группы">' +
    (draft.err ? '<div class="err">' + esc(draft.err) + '</div>' : '') +
    '<button class="btn big" data-act="start">На борт →</button>' +
    '<p class="small">' + NITEMS + ' заданий · около 60 минут · ответ засчитывается сразу, вернуться нельзя</p></div></div>';
}
function crewHtml() {
  var h = '<div class="scr"><div class="hero"><div class="hero-t"><div class="kick">Борт ' + SHIP + '</div><h2>Экипаж</h2></div></div><div class="card">';
  for (var i = 0; i < CREW.length; i++) {
    var c = CREW[i];
    h += '<div class="crew' + (i === 3 ? ' crew-pc' : '') + '"><div class="badge b' + i + '">' + (i === 3 ? '▣' : c.name.charAt(0)) + '</div><div><div class="crew-r">' + c.role + '</div><div class="crew-n">' + c.name + '</div><div class="crew-l">' + c.line + '</div></div></div>';
  }
  h += '<div class="crew"><div class="badge b4">★</div><div><div class="crew-r">Стажёр-логик</div><div class="crew-n">' + esc(S.name) + '</div><div class="crew-l">Группа ' + esc(S.group) + '. Отвечает за то, чтобы ЛОГОС понимал экипаж.</div></div></div>';
  return h + '<button class="btn" data-act="next">Дальше →</button></div></div>';
}
function launchHtml() {
  return '<div class="scr hero-full"><div class="spacer"></div><div class="title-wrap"><div class="kick">Байконур · 06:00 по Москве</div><h2 class="h-big">Ключ на старт!</h2></div>' +
    '<div class="card"><p>Задача экспедиции: долететь до Марса, доставить на станцию «Красная-3» ящик свежих огурцов и вернуться.</p>' +
    '<p>Проблема одна: бортовая ЭВМ ЛОГОС выполняет только логически безупречные команды. Неточная формулировка — и корабль стоит.</p>' +
    '<div class="crt"><div class="crt-h">ЛОГОС:</div>ДОБРОЕ УТРО, ЭКИПАЖ. ЗА КАЖДЫЙ ВЕРНЫЙ ОТВЕТ НАЧИСЛЯЮ БАЛЛЫ. В КОНЦЕ ПОЛЁТА — ОЦЕНКА ОТ 2 ДО 5. ЖЕЛАЮ ЛОГИЧНОГО ПОЛЁТА.</div>' +
    '<button class="btn big" data-act="next">Поехали! →</button></div></div>';
}
function blockHtml(bn) {
  return '<div class="scr hero-full"><div class="spacer"></div><div class="title-wrap"><div class="kick">' + bn.sub + '</div><h2 class="h-big">' + bn.name + '</h2></div>' +
    '<div class="card slim"><button class="btn big" data-act="next">Войти в отсек →</button></div></div>';
}
function secHtml(s) {
  var h = '<div class="scr hero-full"><div class="spacer"></div><div class="title-wrap"><div class="kick">' + s.kicker + '</div><h2>' + s.title + '</h2></div><div class="card">';
  for (var i = 0; i < s.text.length; i++) h += /^ЛОГОС:/.test(s.text[i]) ? '<div class="crt">' + esc(s.text[i]) + '</div>' : '<p>' + esc(s.text[i]) + '</p>';
  return h + '<button class="btn" data-act="next">К заданиям →</button></div></div>';
}
function itemHtml(step) {
  var sec = SECTIONS[step.s], it = sec.items[step.i], key = step.key, done = S.ans[key];
  var d = ui[key] || (ui[key] = initDraft(it, key));
  var h = '<div class="scr"><div class="hero sm"><div class="hero-t"><div class="kick">' + sec.kicker + '</div><h3>' + sec.title + '</h3></div></div><div class="card">';
  h += '<div class="qn">Задание ' + itemNo(S.cur) + ' из ' + NITEMS + ' · ' + maxOf(it) + ' б.</div><div class="hint">' + esc(sec.hint) + '</div>';
  var g = done ? done.g : null, i, j;
  if (it.t === "choice") {
    h += '<div class="q">' + esc(it.q) + '</div>';
    var ord = it.fixed ? range(it.o.length) : perm(key, it.o.length);
    h += '<div class="opts' + (it.fixed && it.o.length <= 4 && maxLen(it.o) < 16 ? ' row' : '') + '">';
    for (j = 0; j < ord.length; j++) { i = ord[j]; var cl = "opt"; if (done) { if (i === it.a) cl += " ok"; else if (i === g) cl += " bad"; else cl += " dim"; }
      h += '<button class="' + cl + '" data-act="choice" data-v="' + i + '"' + (done ? ' disabled' : '') + '>' + esc(it.o[i]) + '</button>'; }
    h += '</div>';
  } else if (it.t === "euler") {
    h += '<div class="q eq"><span class="ta">A</span> ' + esc(it.A) + '<br><span class="tb">B</span> ' + esc(it.B) + '</div><div class="egrid">';
    var eo = perm(key, EKEYS.length);
    for (j = 0; j < eo.length; j++) { var ek = EKEYS[eo[j]], ecl = "eopt"; if (done) { if (ek === it.a) ecl += " ok"; else if (ek === g) ecl += " bad"; else ecl += " dim"; }
      h += '<button class="' + ecl + '" data-act="euler" data-v="' + ek + '"' + (done ? ' disabled' : '') + '>' + eulerSvg(ek) + '<span>' + EUL[ek] + '</span></button>'; }
    h += '</div>';
  } else if (it.t === "multi") {
    h += '<div class="q">' + esc(it.q) + '</div><div class="chips">';
    var mo = perm(key, it.o.length), sel = done ? g : d.sel;
    for (j = 0; j < mo.length; j++) { i = mo[j]; var on = sel.indexOf(i) >= 0, ccl = "chip" + (on ? " on" : "");
      if (done) { if (it.o[i][1] && on) ccl += " ok"; else if (!it.o[i][1] && on) ccl += " bad"; else if (it.o[i][1]) ccl += " miss"; else ccl += " dim"; }
      h += '<button class="' + ccl + '" data-act="chip" data-v="' + i + '"' + (done ? ' disabled' : '') + '>' + esc(it.o[i][0]) + '</button>'; }
    h += '</div>';
    if (!done) h += '<button class="btn" data-act="check">Ввести в ЭВМ</button>';
  } else if (it.t === "parse") {
    var roles = done ? g : d.roles, all = true;
    h += '<div class="parse">';
    for (i = 0; i < it.toks.length; i++) { var r = roles[i], pcl = "tok" + (r ? " r" + r : ""); if (!r) all = false;
      if (done) pcl += r === it.toks[i][1] ? " ok" : " bad";
      h += '<button class="' + pcl + '" data-act="tok" data-v="' + i + '"' + (done ? ' disabled' : '') + '><b>' + esc(it.toks[i][0]) + '</b><small>' + (r ? ROLE[r] : "нажмите") + '</small>' +
        (done && r !== it.toks[i][1] ? '<em>' + ROLE[it.toks[i][1]] + '</em>' : '') + '</button>'; }
    h += '</div>';
    if (!done) h += '<button class="btn" data-act="check"' + (all ? '' : ' disabled') + '>Ввести в ЭВМ</button>';
  } else if (it.t === "order") {
    h += '<div class="q">' + esc(it.q) + '</div>';
    var seq = done ? g : d.seq, po = perm(key, it.o.length);
    h += '<div class="seq"><div class="seq-l">' + esc(it.lo) + ' ↓</div>';
    for (j = 0; j < it.o.length; j++) {
      if (j < seq.length) { var scl = "slot full"; if (done) scl += seq[j] === j ? " ok" : " bad";
        h += '<button class="' + scl + '" data-act="unseq" data-v="' + j + '"' + (done ? ' disabled' : '') + '><i>' + (j + 1) + '</i>' + esc(it.o[seq[j]]) + (done && seq[j] !== j ? '<em>верно: ' + esc(it.o[j]) + '</em>' : '') + '</button>'; }
      else h += '<div class="slot"><i>' + (j + 1) + '</i></div>';
    }
    h += '<div class="seq-l">↓ ' + esc(it.hi) + '</div></div>';
    if (!done) { h += '<div class="pool">'; for (j = 0; j < po.length; j++) if (seq.indexOf(po[j]) < 0) h += '<button class="pchip" data-act="seq" data-v="' + po[j] + '">' + esc(it.o[po[j]]) + '</button>'; h += '</div>';
      h += '<div class="btns2"><button class="btn ghost" data-act="seqreset"' + (seq.length ? '' : ' disabled') + '>Сбросить</button><button class="btn" data-act="check"' + (seq.length === it.o.length ? '' : ' disabled') + '>Ввести в ЭВМ</button></div>'; }
  } else if (it.t === "square") {
    h += '<div class="q given">' + esc(it.given) + '</div><div class="sq">';
    var sv = done ? g : d.vals, full = true;
    for (i = 0; i < it.rows.length; i++) { if (!sv[i]) full = false;
      h += '<div class="sqr"><div class="sqt">' + esc(it.rows[i][0]) + '</div><div class="seg">';
      for (j = 0; j < 3; j++) { var vv = "TFU".charAt(j), qcl = "sg" + (sv[i] === vv ? " on" : ""); if (done) { if (vv === it.rows[i][1]) qcl += " ok"; else if (sv[i] === vv) qcl += " bad"; }
        h += '<button class="' + qcl + '" data-act="sq" data-r="' + i + '" data-v="' + vv + '"' + (done ? ' disabled' : '') + '>' + SQ[vv] + '</button>'; }
      h += '</div></div>'; }
    h += '</div>';
    if (!done) h += '<button class="btn" data-act="check"' + (full ? '' : ' disabled') + '>Ввести в ЭВМ</button>';
  }
  if (done) {
    var mx = maxOf(it), w = done.s === mx ? pick(OK_W, key) : done.s === 0 ? pick(BAD_W, key) : pick(MID_W, key);
    h += '<div class="crt fb ' + (done.s === mx ? "good" : done.s === 0 ? "nope" : "half") + '"><div class="crt-h">ЛОГОС: ' + w + ' <span>+' + done.s + ' из ' + mx + '</span></div>' + esc(it.why) + '</div>';
    h += '<button class="btn" data-act="next">' + (STEPS[S.cur + 1].k === "item" ? "Дальше →" : "Продолжить полёт →") + '</button>';
  }
  return h + '</div></div>';
}
function maxLen(a) { var m = 0; for (var i = 0; i < a.length; i++) m = Math.max(m, a[i].length); return m; }
function initDraft(it, key) { if (it.t === "multi") return { sel: [] }; if (it.t === "parse") return { roles: [] }; if (it.t === "order") return { seq: [] }; if (it.t === "square") return { vals: [] }; return {}; }
function correctText(it) {
  if (it.t === "choice") return it.o[it.a];
  if (it.t === "euler") return EUL[it.a];
  if (it.t === "multi") { var r = []; for (var i = 0; i < it.o.length; i++) if (it.o[i][1]) r.push(it.o[i][0]); return r.join("; "); }
  if (it.t === "parse") { var p = []; for (var j = 0; j < it.toks.length; j++) p.push(it.toks[j][0] + " — " + ROLE[it.toks[j][1]]); return p.join("; "); }
  if (it.t === "order") return it.o.join(" → ");
  if (it.t === "square") { var q = []; for (var k = 0; k < it.rows.length; k++) q.push(it.rows[k][0] + ": " + SQ[it.rows[k][1]]); return q.join("; "); }
}
function qText(it) { return it.t === "euler" ? "A: " + it.A + " / B: " + it.B : it.t === "parse" ? "Разбор: «" + it.toks.map(function (x) { return x[0]; }).join(" ") + "»" : it.t === "square" ? it.given : it.q; }
function attemptCode() { var n; try { var a = new Uint32Array(1); window.crypto.getRandomValues(a); n = a[0]; } catch (e) { n = Math.floor(Math.random() * 4294967296); } n = 100000 + n % 900000; var s = String(n); return s.slice(0, 3) + " " + s.slice(3); }
function finalHtml() {
  if (!S.t1) { S.t1 = Date.now(); save(); }
  if (!S.code) { S.code = attemptCode(); save(); }
  var sc = score(), pct = Math.round(sc / TOTAL * 1000) / 10, m = gradeOf(pct), mins = Math.max(1, Math.round((S.t1 - S.t0) / 60000));
  var h = '<div class="scr"><div class="hero"><div class="hero-t"><div class="kick">Экспедиция завершена · ' + esc(S.name) + ', гр. ' + esc(S.group) + '</div><h2>Возвращение на Землю</h2></div></div><div class="card">';
  h += '<div class="mark m' + m[1] + '"><div class="mark-n">' + m[1] + '</div><div><div class="mark-s">' + sc + ' из ' + TOTAL + ' баллов · ' + pct + '%</div><div class="mark-t">' + m[2] + '</div></div></div>' +
    '<div class="acode"><span>Код попытки</span><b>' + S.code + '</b></div>';
  for (var b = 0; b < BLOCKS.length; b++) {
    var got = 0, mx = 0;
    for (var i = 0; i < SECTIONS.length; i++) if (SECTIONS[i].block === BLOCKS[b].id) for (var j = 0; j < SECTIONS[i].items.length; j++) { mx += maxOf(SECTIONS[i].items[j]); var a = S.ans[SECTIONS[i].id + "_" + j]; if (a) got += a.s; }
    h += '<div class="bar"><div class="bar-t"><span>Отсек ' + BLOCKS[b].id + ' · ' + BLOCKS[b].name + '</span><b>' + got + '/' + mx + '</b></div><div class="bar-b"><i style="width:' + Math.round(got / mx * 100) + '%"></i></div></div>';
  }
  h += '<p class="small">Время полёта: ' + mins + ' мин. Шкала: 5 — от 85%, 4 — от 70%, 3 — от 50%.</p>';
  var errs = [];
  for (var x = 0; x < SECTIONS.length; x++) for (var y = 0; y < SECTIONS[x].items.length; y++) { var it = SECTIONS[x].items[y], an = S.ans[SECTIONS[x].id + "_" + y]; if (an && an.s < maxOf(it)) errs.push([SECTIONS[x].title, it, an.s]); }
  h += '<h4 class="eh">Бортовой журнал ошибок (' + errs.length + ')</h4>';
  if (!errs.length) h += '<div class="crt good">ОШИБОК НЕ ЗАФИКСИРОВАНО. РЕДКИЙ СЛУЧАЙ. ЗАНОШУ В АРХИВ.</div>';
  for (var e = 0; e < errs.length; e++) h += '<div class="err-i"><div class="err-s">' + esc(errs[e][0]) + ' · ' + errs[e][2] + '/' + maxOf(errs[e][1]) + '</div><div class="err-q">' + esc(qText(errs[e][1])) + '</div><div class="err-a">Верно: ' + esc(correctText(errs[e][1])) + '</div></div>';
  h += '<div class="reset">' + (ui.reset ? '<label class="fl">Пароль преподавателя</label><input id="inPw" class="inp" type="password" autocomplete="off">' + (ui.pwErr ? '<div class="err">' + ui.pwErr + '</div>' : '') + '<div class="btns2"><button class="btn ghost" data-act="rcancel">Отмена</button><button class="btn" data-act="rgo">Сбросить</button></div>' : '<button class="link" data-act="reset">Новый полёт (для преподавателя)</button>') + '</div>';
  return h + '</div></div>';
}

/* ---------- события ---------- */
document.addEventListener("click", function (ev) {
  var el = ev.target; while (el && el !== document && !(el.getAttribute && el.getAttribute("data-act"))) el = el.parentNode;
  if (!el || el === document || el.disabled) return;
  var act = el.getAttribute("data-act"), v = el.getAttribute("data-v"), top = false;
  if (act === "start") {
    draft.name = (document.getElementById("inName").value || "").replace(/^\s+|\s+$/g, "");
    draft.group = (document.getElementById("inGroup").value || "").replace(/^\s+|\s+$/g, "");
    if (draft.name.length < 3) { draft.err = "Впишите фамилию и имя."; render(); return; }
    if (!draft.group) { draft.err = "Впишите группу."; render(); return; }
    S = { name: draft.name, group: draft.group, seed: (hashStr(draft.name.toLowerCase() + "|" + draft.group) ^ (Date.now() & 0xffff)) >>> 0, cur: 1, ans: {}, t0: Date.now(), code: attemptCode() };
    STEPS = buildSteps(); top = true;
  } else if (act === "next") { if (S.cur < STEPS.length - 1) S.cur++; top = true; }
  else if (act === "reset") { ui.reset = true; ui.pwErr = ""; }
  else if (act === "rcancel") { ui.reset = false; }
  else if (act === "rgo") {
    var pw = document.getElementById("inPw").value;
    if (hashStr(pw) === PASS_HASH) { S = null; STEPS = null; ui = {}; draft = { name: "", group: "", err: "" }; save(); render(); window.scrollTo(0, 0); return; }
    ui.pwErr = "Неверный пароль.";
  } else {
    var step = STEPS[S.cur]; if (step.k !== "item" || S.ans[step.key]) return;
    var it = SECTIONS[step.s].items[step.i], d = ui[step.key], g = null;
    if (act === "choice") g = +v;
    else if (act === "euler") g = v;
    else if (act === "chip") { var k = d.sel.indexOf(+v); if (k >= 0) d.sel.splice(k, 1); else d.sel.push(+v); }
    else if (act === "tok") { var cur = d.roles[+v], ni = cur ? (ROLES.indexOf(cur) + 1) % 4 : 0; d.roles[+v] = ROLES[ni]; }
    else if (act === "seq") d.seq.push(+v);
    else if (act === "unseq") d.seq.splice(+v, 1);
    else if (act === "seqreset") d.seq = [];
    else if (act === "sq") d.vals[+el.getAttribute("data-r")] = v;
    else if (act === "check") g = it.t === "multi" ? d.sel.slice() : it.t === "parse" ? d.roles.slice() : it.t === "order" ? d.seq.slice() : d.vals.slice();
    if (g !== null) { S.ans[step.key] = { s: grade(it, g), g: g }; }
  }
  save(); render();
  if (top) window.scrollTo(0, 0);
});
document.addEventListener("input", function (ev) { if (ev.target.id === "inName") draft.name = ev.target.value; if (ev.target.id === "inGroup") draft.group = ev.target.value; });
load(); render();
